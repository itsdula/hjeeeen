<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HJEN Studio — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#efece3; --paper-2:#e6e1d3; --ink:#1b1a16; --muted:#6d685c; --muted-2:#8b8677;
    --mark:#e7c948;
    --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
    --sans:-apple-system,'Segoe UI',Helvetica,Arial,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:grid; grid-template-columns:1.05fr .95fr; min-height:100dvh; }
  ::selection { background:var(--mark); color:var(--ink); }
  /* Left — the promise */
  .stage { padding:clamp(28px,5vw,72px); display:flex; flex-direction:column; justify-content:space-between; }
  .brand { font-family:var(--serif); font-size:26px; letter-spacing:.01em; }
  .brand b { font-weight:400; }
  .lede h1 { font-family:var(--serif); font-weight:400; font-size:clamp(38px,5.4vw,72px); line-height:1.02; margin:0 0 18px; letter-spacing:-.01em; }
  .lede p { font-size:clamp(15px,1.4vw,18px); line-height:1.6; color:var(--muted); max-width:34ch; margin:0; }
  .foot { font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); }
  /* Right — the door */
  .door { background:var(--paper-2); display:flex; align-items:center; justify-content:center; padding:clamp(24px,4vw,56px); }
  .card { width:100%; max-width:400px; }
  .card > .hint { font-family:var(--serif); font-size:22px; margin:0 0 4px; }
  .card > .sub { font-size:13px; color:var(--muted); margin:0 0 22px; }
  #clerk { min-height:320px; }
  .loading { color:var(--muted-2); font-size:13px; }
  @media (max-width:820px){ body{ grid-template-columns:1fr; } .stage{ min-height:auto; } .door{ min-height:60dvh; } }
</style>
</head>
<body>
  <section class="stage">
    <div class="brand"><b>HJEN</b> Studio</div>
    <div class="lede">
      <h1>Make the film<br/>before you shoot it.</h1>
      <p>A Saudi-DNA creative studio — brief to key visual, in one room. Sign in to start; your first frames are on us.</p>
    </div>
    <div class="foot">HJEN Studio · 2026</div>
  </section>

  <section class="door">
    <div class="card">
      <p class="hint">Welcome</p>
      <p class="sub">Sign in or create an account to enter the studio.</p>
      <div id="clerk"><span class="loading">Loading…</span></div>
    </div>
  </section>

<script>
(async function () {
  var el = document.getElementById('clerk');
  function fail(m){ el.innerHTML = '<span class="loading">' + m + '</span>'; }
  var cfg;
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) { return fail('Could not reach the studio. Refresh to retry.'); }
  if (!cfg.clerkEnabled || !cfg.clerkPublishableKey || !cfg.clerkFrontendApi) return fail('Sign-in is not configured yet.');
  // Load Clerk.
  await new Promise(function (resolve, reject) {
    var s = document.createElement('script'); s.async = true; s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', cfg.clerkPublishableKey);
    s.src = 'https://' + cfg.clerkFrontendApi + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    s.onload = resolve; s.onerror = function(){ reject(new Error('clerk')); };
    document.head.appendChild(s);
  }).catch(function(){ fail('Sign-in failed to load. Refresh to retry.'); });
  if (!window.Clerk) return;
  await window.Clerk.load();
  // Already signed in → straight into the studio.
  if (window.Clerk.user) { location.replace('/studio/'); return; }
  // Otherwise mount sign-in (with a sign-up link); land in the studio after.
  el.innerHTML = '';
  window.Clerk.mountSignIn(el, { afterSignInUrl: '/studio/', afterSignUpUrl: '/studio/', signUpUrl: '/' });
  window.Clerk.addListener(function (r) { if (r.user) location.replace('/studio/'); });
})();
</script>
</body>
</html>
