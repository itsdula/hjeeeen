<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HJEN Studio — Preview</title>
<style>
  :root {
    --bg:#0b0c0e; --panel:#141619; --panel-2:#191c20; --line:#24272d; --line-2:#2f333a;
    --ink:#e9ebee; --muted:#8b929e; --muted-2:#6b7280;
    --accent:#e0a24a; --accent-ink:#1a1205; --accent-dim:#3a2e17;
    --danger:#e5705a; --ok:#5fb98e;
    --r:12px; --r-sm:9px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
    min-height:100vh;
  }
  ::selection { background:var(--accent-dim); }
  a { color:inherit; }

  /* ---------- header ---------- */
  header {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 22px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
    background:rgba(11,12,14,.82); backdrop-filter:saturate(140%) blur(10px);
  }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand svg { height:19px; width:auto; color:var(--ink); display:block; }
  .brand .tag {
    font-size:11px; letter-spacing:.16em; color:var(--muted); border:1px solid var(--line-2);
    padding:3px 8px; border-radius:20px; text-transform:uppercase;
  }
  .meter { font-size:13px; color:var(--muted); text-align:left; line-height:1.5; }
  .meter b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .meter .hi { color:var(--accent); }

  /* ---------- layout ---------- */
  main { max-width:1240px; margin:0 auto; padding:22px; display:grid; grid-template-columns:390px 1fr; gap:22px; align-items:start; }
  @media (max-width:860px){ main { grid-template-columns:1fr; padding:16px; gap:16px; } }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; }
  .controls { position:sticky; top:74px; }
  @media (max-width:860px){ .controls { position:static; } }

  label.lbl { display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin:16px 0 8px; }
  label.lbl:first-child { margin-top:0; }

  textarea, input[type=text] {
    width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line-2);
    border-radius:var(--r-sm); padding:12px; font-size:14px; font-family:inherit; line-height:1.6;
    transition:border-color .15s;
  }
  textarea { min-height:132px; resize:vertical; }
  textarea:focus, input:focus { outline:none; border-color:var(--accent); }
  textarea::placeholder { color:var(--muted-2); }

  .row { display:flex; gap:8px; }
  .row.mt { margin-top:10px; }

  button { font-family:inherit; cursor:pointer; border-radius:var(--r-sm); font-size:13.5px; border:1px solid var(--line-2); background:var(--panel-2); color:var(--ink); padding:10px 14px; transition:.15s; }
  button:hover:not(:disabled) { border-color:var(--line-2); background:#20242a; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  button.primary:hover:not(:disabled) { background:#eab05f; }

  select { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:10px 12px; font-size:13.5px; font-family:inherit; }
  select:focus { outline:none; border-color:var(--accent); }

  /* segmented control */
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; min-width:56px; padding:9px 6px; font-size:13px; color:var(--muted); text-align:center; }
  .seg button.on { background:var(--panel-2); border-color:var(--accent); color:var(--ink); }
  .seg .sub { display:block; font-size:10px; color:var(--muted-2); margin-top:2px; }

  /* references */
  .drop {
    border:1px dashed var(--line-2); border-radius:var(--r-sm); padding:14px; text-align:center;
    font-size:12.5px; color:var(--muted); cursor:pointer; transition:.15s; background:var(--bg);
  }
  .drop:hover { border-color:var(--accent); color:var(--ink); }
  .drop input { display:none; }
  .refs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .refs .chip { position:relative; }
  .refs img { width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line-2); display:block; }
  .refs .x { position:absolute; top:-6px; inset-inline-start:-6px; width:18px; height:18px; border-radius:50%; background:#000; border:1px solid var(--line-2); color:var(--ink); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  .make { margin-top:20px; }
  .make button { width:100%; padding:14px; font-size:15px; }
  .hint { font-size:11.5px; color:var(--muted-2); margin-top:8px; text-align:center; }

  .status { margin-top:12px; font-size:13px; min-height:20px; }
  .status.err { color:var(--danger); }
  .status.work { color:var(--muted); }
  .status .el { color:var(--muted-2); font-variant-numeric:tabular-nums; }

  /* ---------- gallery ---------- */
  .stage-head { display:flex; align-items:center; justify-content:space-between; margin:2px 2px 14px; }
  .stage-head h2 { margin:0; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .stage-head .count { font-size:12px; color:var(--muted-2); }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .gallery figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .gallery img { width:100%; display:block; background:#000; cursor:zoom-in; }
  .gallery figcaption { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:11.5px; color:var(--muted-2); }
  .gallery figcaption a { color:var(--accent); text-decoration:none; font-weight:600; }
  .gallery figcaption a:hover { text-decoration:underline; }

  .placeholder { border:1px solid var(--line); border-radius:var(--r); padding:60px 24px; text-align:center; color:var(--muted-2); font-size:14px; background:linear-gradient(180deg,var(--panel),var(--bg)); }
  .placeholder .big { font-size:15px; color:var(--muted); margin-bottom:6px; }

  /* working tile */
  .tile-work { border:1px solid var(--line-2); border-radius:var(--r); aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); background:var(--panel); }
  .spin { width:26px; height:26px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .tile-work .q { font-size:12px; color:var(--muted-2); }

  /* survey */
  .survey { margin-top:14px; background:var(--panel-2); border:1px solid var(--accent-dim); border-radius:var(--r-sm); padding:14px; font-size:13px; }
  .survey .q { margin-bottom:10px; color:var(--ink); }

  /* gate */
  .gate { max-width:460px; margin:16vh auto; text-align:center; padding:0 20px; }
  .gate svg { height:24px; color:var(--ink); margin-bottom:22px; }
  .gate h2 { color:var(--accent); font-size:20px; margin:0 0 10px; }
  .gate p { color:var(--muted); line-height:1.7; font-size:14px; }

  /* lightbox */
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:50; cursor:zoom-out; padding:24px; }
  .lb.on { display:flex; }
  .lb img { max-width:96vw; max-height:92vh; border-radius:8px; }
</style>
</head>

<main id="app" style="display:none">
  <!-- controls -->
  <section class="panel controls">
    <label class="lbl">Shot description</label>
    <textarea id="prompt" placeholder="Describe the scene in detail… then refine it or run a skill."></textarea>
    <div class="row mt">
      <button id="refineBtn" style="flex:1">↻ Refine</button>
      <select id="skillSel" style="flex:1.2"><option value="">— skill —</option></select>
      <button id="skillBtn">Run</button>
    </div>

    <label class="lbl">Visual references <span style="color:var(--muted-2);text-transform:none;letter-spacing:0">(optional)</span></label>
    <label class="drop" for="refFile">Drag an image or click to choose — up to 4
      <input type="file" id="refFile" accept="image/*" multiple /></label>
    <div class="refs" id="refs"></div>

    <label class="lbl">Model</label>
    <select id="model"></select>

    <label class="lbl">Look</label>
    <div class="seg" id="lookSeg"></div>

    <label class="lbl">Aspect</label>
    <div class="seg" id="aspectSeg"></div>

    <label class="lbl">Size</label>
    <div class="seg" id="detailSeg">
      <button data-v="std" class="on">Standard</button>
      <button data-v="lg">Large</button>
    </div>

    <label class="lbl">Quality</label>
    <div class="seg" id="qualSeg">
      <button data-v="low">Low</button>
      <button data-v="medium" class="on">Medium</button>
      <button data-v="high">High</button>
    </div>

    <label class="lbl">Atmosphere <span style="color:var(--muted-2);text-transform:none;letter-spacing:0">(optional)</span></label>
    <input type="text" id="atmosphere" placeholder="e.g. Riyadh dust haze, late afternoon" />

    <label class="lbl">Negative <span style="color:var(--muted-2);text-transform:none;letter-spacing:0">(optional)</span></label>
    <input type="text" id="negative" placeholder="e.g. falcon, desert sunset, cliché" />

    <div class="make">
      <button class="primary" id="makeBtn">✦ Make</button>
      <div class="hint" id="outHint"></div>
    </div>
    <div class="status" id="status"></div>
    <div id="surveyHost"></div>
  </section>

  <!-- stage -->
  <section>
    <div class="stage-head"><h2>Shots</h2><span class="count" id="galCount"></span></div>
    <div id="stage">
      <div class="placeholder"><div class="big">Your canvas is empty</div>Type a prompt and press Make — your shots appear here.</div>
    </div>
  </section>
</main>

<script>
// Two entry modes: /s/<token> = magic-link (token in the path);
// /app = Clerk sign-in (token is a fresh Clerk session JWT per request).
const IS_CLERK = location.pathname === '/app';
const magicToken = location.pathname.startsWith('/s/') ? (location.pathname.split('/')[2] || '') : '';
const $ = (id) => document.getElementById(id);
let refsList = [];
let madeCount = 0, surveyShown = false, working = false;

// Clerk session tokens are short-lived, so fetch a fresh one per request.
async function authToken() {
  if (IS_CLERK) {
    try { return (window.Clerk && window.Clerk.session) ? (await window.Clerk.session.getToken()) || '' : ''; }
    catch { return ''; }
  }
  return magicToken;
}

// Aspect presets → real pixel sizes (multiples of 16, aspect within gpt-image's 1:3–3:1).
const ASPECTS = [
  { id:'1:1',  label:'1:1',  std:[1024,1024], lg:[1536,1536] },
  { id:'4:5',  label:'4:5',  std:[1024,1280], lg:[1280,1600] },
  { id:'9:16', label:'9:16', std:[864,1536],  lg:[1088,1920] },
  { id:'16:9', label:'16:9', std:[1536,864],  lg:[1920,1088] },
  { id:'21:9', label:'21:9', std:[1536,656],  lg:[2016,864]  },
];
// Curated cinematic looks — each folds an on-brand clause into the prompt.
const LOOKS = [
  { id:'auto',  label:'Auto',   clause:'' },
  { id:'cine',  label:'Cinema', clause:'Cinematic film still, 35mm film grain, warm-and-teal grade, soft directional light, shallow depth of field.' },
  { id:'golden',label:'Golden', clause:'Golden hour, warm low sun, long soft shadows, gentle atmospheric haze.' },
  { id:'doc',   label:'Doc',    clause:'Candid documentary photograph, natural available light, honest realistic tones.' },
  { id:'studio',label:'Studio', clause:'Studio portrait lighting, soft key with gentle fill, clean seamless background.' },
  { id:'night', label:'Night',  clause:'Night scene, neon and practical lights, moody low-key, teal and amber contrast.' },
];
let sel = { aspect:'4:5', detail:'std', quality:'medium', model:'', look:'auto' };

async function api(path, opts={}) {
  const t = await authToken();
  const res = await fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + t, ...(opts.headers||{}) } });
  const data = await res.json().catch(() => ({ ok:false, message:'Couldn\'t read the response' }));
  return { status: res.status, data };
}

function setMeter(s) {
  $('meter').innerHTML =
    `Welcome ${s.name || ''} · <span class="hi"><b>${s.remaining}</b></span> shots left · <b>${s.daysLeft}</b> days`;
}
function updateRemaining(n) {
  const m = $('meter').querySelector('.hi b'); if (m) m.textContent = n;
}
function gateClosed(msg) {
  $('app').style.display = 'none';
  const g = $('gateMsg'); g.style.display = 'block';
  g.innerHTML = $('wm').innerHTML +
    `<h2>Preview ended</h2><p>${msg || 'Invalid link.'}</p>`;
}
function pendingScreen(data) {
  $('app').style.display = 'none';
  const g = $('gateMsg'); g.style.display = 'block';
  const pos = data.position ? `<div class="pos" style="display:inline-block;margin:16px 0;padding:10px 20px;border:1px solid var(--line-2);border-radius:99px;font-size:15px">Your place in line: <b style="color:var(--accent)">#${data.position}</b></div>` : '';
  g.innerHTML = $('wm').innerHTML +
    `<h2 style="color:var(--accent)">You're in the Early Access queue</h2>
     <p>Welcome ${data.name || ''} — we received your request. We activate accounts in waves, and this link will work the moment your account is activated.</p>
     ${pos}
     <p style="font-size:13px;color:var(--muted-2)">Save this link — it takes you straight into the studio.</p>`;
}

// ---- segmented controls ----
function wireSeg(hostId, key, onChange) {
  const host = $(hostId);
  host.querySelectorAll('button').forEach(b => b.onclick = () => {
    host.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); sel[key] = b.dataset.v; onChange && onChange(); refreshHint();
  });
}
function buildAspectSeg() {
  $('aspectSeg').innerHTML = ASPECTS.map(a =>
    `<button data-v="${a.id}" class="${a.id===sel.aspect?'on':''}">${a.label}</button>`).join('');
  wireSeg('aspectSeg','aspect');
}
function buildLookSeg() {
  $('lookSeg').innerHTML = LOOKS.map(l =>
    `<button data-v="${l.id}" class="${l.id===sel.look?'on':''}">${l.label}</button>`).join('');
  wireSeg('lookSeg','look');
}
function currentSize() {
  const a = ASPECTS.find(x => x.id === sel.aspect) || ASPECTS[0];
  const [w,h] = sel.detail === 'lg' ? a.lg : a.std;
  return `${w}x${h}`;
}
function refreshHint() {
  const [w,h] = currentSize().split('x').map(Number);
  const mp = (w*h/1e6).toFixed(1);
  $('outHint').textContent = `${w}×${h} · ${mp}MP · ${sel.aspect}`;
}

// ---- boot ----
async function boot() {
  $('logo').innerHTML = $('wm').innerHTML;
  const { status, data } = await api('/api/session');
  if (status !== 200 || !data.ok) {
    if (data.reason === 'pending') return pendingScreen(data);
    return gateClosed(data.message);
  }
  $('app').style.display = 'grid';
  setMeter(data);

  // models — populated from the server when available; falls back to the live default.
  const md = await api('/api/models').catch(() => ({ data:{ ok:false } }));
  const models = (md.data && md.data.ok && Array.isArray(md.data.models) && md.data.models.length)
    ? md.data.models : [{ id:'gpt-image-2', label:'ChatGPT Image 2.0' }];
  $('model').innerHTML = models.map(m => `<option value="${m.id}">${m.label||m.id}</option>`).join('');
  sel.model = models[0].id;
  $('model').onchange = e => sel.model = e.target.value;

  const sk = await api('/api/skills');
  if (sk.data.ok) for (const s of sk.data.skills) {
    const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; $('skillSel').appendChild(o);
  }

  buildAspectSeg();
  buildLookSeg();
  wireSeg('detailSeg','detail'); wireSeg('qualSeg','quality');
  refreshHint();
  loadHistory();
}

// Load this account's persisted shots into the gallery on entry.
async function loadHistory() {
  try {
    const { data } = await api('/api/history');
    if (!data.ok || !data.items.length) return;
    const t = await authToken();
    const stage = $('stage');
    stage.innerHTML = '<div class="gallery" id="gallery"></div>';
    const g = $('gallery');
    for (const it of data.items) {
      const src = `/o?f=${encodeURIComponent(it.f)}&t=${encodeURIComponent(t)}`;
      const fig = document.createElement('figure');
      fig.innerHTML = `<img src="${src}" alt="" loading="lazy" /><figcaption><span>Saved</span><a href="${src}" download="hjen_take.png">↓ Download</a></figcaption>`;
      fig.querySelector('img').onclick = () => { $('lbImg').src = src; $('lb').classList.add('on'); };
      g.appendChild(fig);
    }
    madeCount = data.items.length;
    $('galCount').textContent = madeCount + (madeCount === 1 ? ' shot' : ' shots');
  } catch { /* ignore */ }
}

// ---- refine / skill ----
$('refineBtn').onclick = async () => {
  const raw = $('prompt').value.trim(); if (!raw) return;
  setStatus(''); const b = $('refineBtn'); b.disabled = true; b.textContent = '…';
  const { data } = await api('/api/enhance', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ rawPrompt: raw, references: refsList.map(r => ({ filePath:r.path, category:r.category, name:r.name })) }) });
  if (data.ok) $('prompt').value = data.enhancedPrompt; else setStatus(data.message || 'Refine failed', 'err');
  b.disabled = false; b.textContent = '↻ Refine';
};
$('skillBtn').onclick = async () => {
  const skillId = $('skillSel').value; const raw = $('prompt').value.trim();
  if (!skillId || !raw) { setStatus('Choose a skill and type a description.', 'err'); return; }
  setStatus(''); const b = $('skillBtn'); b.disabled = true; b.textContent = '…';
  const { data } = await api('/api/skill/run', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ skillId, prompt: raw }) });
  if (data.ok) $('prompt').value = data.masterPrompt; else setStatus(data.message || 'Couldn\'t run skill', 'err');
  b.disabled = false; b.textContent = 'Run';
};

// ---- references ----
function fileToBase64(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); }); }
function renderRefs() {
  $('refs').innerHTML = refsList.map((r,i) =>
    `<div class="chip"><img src="${r.preview}" /><div class="x" data-i="${i}">×</div></div>`).join('');
  $('refs').querySelectorAll('.x').forEach(x => x.onclick = () => { refsList.splice(+x.dataset.i,1); renderRefs(); });
}
$('refFile').onchange = async (e) => {
  const files = Array.from(e.target.files || []).slice(0, 4 - refsList.length);
  for (const file of files) {
    const dataBase64 = await fileToBase64(file);
    const { data } = await api('/api/refs', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ dataBase64, filename: file.name, category: 'general' }) });
    if (data.ok) refsList.push({ path:data.path, category:data.category, name:data.name, preview:URL.createObjectURL(file) });
    else setStatus(data.message || 'Couldn\'t upload reference', 'err');
  }
  renderRefs(); e.target.value = '';
};

// ---- status ----
function setStatus(msg, cls='') { const s = $('status'); s.className = 'status ' + cls; s.innerHTML = msg; }

// ---- make ----
$('makeBtn').onclick = async () => {
  if (working) return;
  const prompt = $('prompt').value.trim();
  if (!prompt) { setStatus('Type a description first.', 'err'); return; }
  // Fold the chosen Look + optional Atmosphere / Negative into the prompt
  // (gpt-image has no native look/negative params, so we phrase them inline).
  const lookClause = (LOOKS.find(l => l.id === sel.look) || {}).clause || '';
  const atmosphere = $('atmosphere').value.trim();
  const negative = $('negative').value.trim();
  const finalPrompt = prompt
    + (lookClause ? ` ${lookClause}` : '')
    + (atmosphere ? ` Atmosphere: ${atmosphere}.` : '')
    + (negative ? ` Avoid: ${negative}.` : '');
  working = true;
  const btn = $('makeBtn'); btn.disabled = true; btn.textContent = '… working';

  // working tile at the front of the stage
  const stage = $('stage');
  if (stage.querySelector('.placeholder')) stage.innerHTML = '<div class="gallery" id="gallery"></div>';
  let gallery = $('gallery') || (() => { stage.innerHTML = '<div class="gallery" id="gallery"></div>'; return $('gallery'); })();
  const workTile = document.createElement('div');
  workTile.className = 'tile-work';
  workTile.innerHTML = `<div class="spin"></div><div id="workMsg">Making…</div><div class="q" id="workEl"></div>`;
  gallery.prepend(workTile);

  // elapsed + queue-aware reassurance (the server absorbs rate-limit bursts, so a
  // peak-time make can wait a few seconds — tell the user instead of a silent spinner).
  const t0 = Date.now();
  const timer = setInterval(() => {
    const s = Math.floor((Date.now()-t0)/1000);
    const el = document.getElementById('workEl'); if (el) el.textContent = s + 's';
    const wm = document.getElementById('workMsg');
    if (wm) wm.textContent = s < 6 ? 'Making…' : s < 20 ? 'Rendering…' : 'Queued at peak — arriving in a moment…';
  }, 1000);

  setStatus('');
  const { status, data } = await api('/api/make', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ prompt: finalPrompt, quality: sel.quality, size: currentSize(), modelId: sel.model,
      referencePaths: refsList.map(r => r.path) }) });

  clearInterval(timer); workTile.remove();
  working = false; btn.disabled = false; btn.textContent = '✦ Make';

  if (status === 200 && data.ok) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${data.image}" alt="" /><figcaption><span>${sel.aspect} · ${sel.quality}</span><a href="${data.image}" download="hjen_take_${madeCount+1}.png">↓ Download</a></figcaption>`;
    fig.querySelector('img').onclick = () => { $('lbImg').src = data.image; $('lb').classList.add('on'); };
    gallery.prepend(fig);
    updateRemaining(data.remaining);
    $('galCount').textContent = (++madeCount) + ' shots';
    maybeSurvey();
  } else if (status === 403) {
    gateClosed(data.message);
  } else if (status === 422) {
    setStatus('⚠︎ ' + (data.message || 'Description rejected — simplify it or run Refine.'), 'err');
  } else {
    setStatus('Shot failed — ' + (data.message || 'Temporary congestion, try again in a moment.'), 'err');
  }
};

function maybeSurvey() {
  if (surveyShown || madeCount < 3) return; surveyShown = true;
  const host = $('surveyHost');
  host.innerHTML = `<div class="survey"><div class="q">One question: would you pay for a tool like this?</div>
    <div class="row"><button data-pay="yes" style="flex:1">Yes</button><button data-pay="maybe" style="flex:1">Maybe</button><button data-pay="no" style="flex:1">No</button></div></div>`;
  host.querySelectorAll('button').forEach(btn => btn.onclick = async () => {
    await api('/api/survey', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ wouldPay: btn.dataset.pay }) });
    host.innerHTML = '<div class="survey">Thanks — your answer was recorded.</div>';
  });
}

// ---- entry: magic-link boots straight in; /app boots Clerk sign-in first ----
function loadClerkScript(pk, fapi) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.async = true; s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', pk);
    s.src = `https://${fapi}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
    s.onload = resolve; s.onerror = () => reject(new Error('clerk load failed'));
    document.head.appendChild(s);
  });
}
function showSignIn() {
  $('app').style.display = 'none';
  const g = $('gateMsg'); g.style.display = 'block';
  g.innerHTML = $('wm').innerHTML +
    `<h2 style="color:var(--accent)">Sign in to HJEN Studio</h2>
     <p style="color:var(--muted)">Access your Early-Access account.</p>
     <div id="clerk-signin" style="margin-top:20px;display:flex;justify-content:center"></div>`;
  window.Clerk.mountSignIn(document.getElementById('clerk-signin'));
  window.Clerk.addListener(({ user }) => { if (user) location.reload(); });
}
async function start() {
  if (IS_CLERK) {
    let cfg;
    try { cfg = await (await fetch('/api/config')).json(); } catch { return gateClosed('Could not reach the server.'); }
    if (!cfg.clerkEnabled) return gateClosed('Sign-in is not configured yet.');
    try {
      await loadClerkScript(cfg.clerkPublishableKey, cfg.clerkFrontendApi);
      await window.Clerk.load();
    } catch { return gateClosed('Sign-in failed to load. Please retry.'); }
    if (!window.Clerk.user) return showSignIn();
    // signed in → mount the organization switcher (personal ↔ teams) + sign out.
    const hdr = document.querySelector('header');
    const orgEl = document.createElement('div');
    orgEl.style.cssText = 'margin-inline-end:auto;padding-inline-start:14px';
    hdr?.insertBefore(orgEl, hdr.querySelector('.meter'));
    try { window.Clerk.mountOrganizationSwitcher(orgEl, { hidePersonal: false }); } catch {}
    // Switching org re-scopes the session token → reboot to the right account.
    let curOrg = window.Clerk.organization ? window.Clerk.organization.id : null;
    window.Clerk.addListener(() => {
      const now = window.Clerk.organization ? window.Clerk.organization.id : null;
      if (now !== curOrg) { curOrg = now; location.reload(); }
    });
    // Clerk UserButton — avatar menu with Manage account + Sign out. Appended to
    // the header (not .meter, which setMeter() overwrites) so it always shows.
    const ub = document.createElement('div');
    ub.style.cssText = 'margin-inline-start:14px;display:flex;align-items:center';
    document.querySelector('header')?.appendChild(ub);
    try { window.Clerk.mountUserButton(ub, { afterSignOutUrl: '/app' }); } catch {}
  }
  boot();
}
start();
</script>
