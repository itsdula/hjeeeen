<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Space — Studio Stage</title>
<!--
  Film Space (Phase 3) — a BUILT 3D studio stage. A realistic FK-posable stand-in
  (COCO-17 preserved), an objects library (Nth stand-in · wall · window · car ·
  shop · a real CubeCamera mirror), a bottom KEYFRAME TIMELINE (camera + per-object
  tracks), real-time Play, and MOVE recording (up to 20s). Movement PRESETS move
  the CAMERA only, relative to a static character; subject/object motion is authored
  on the timeline. Depth / outline / pose are exact and offline. Three.js is the
  SAME vendored copy HJEN SET uses. Talks to FilmSpaceView via postMessage.
-->
<style>
  :root{ --bg:#0f1012; --ink:#e9eaec; --ink-dim:rgba(233,234,236,.62); --ink-faint:rgba(233,234,236,.30);
         --rule:rgba(233,234,236,.14); --accent:#F25502; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font:12px/1.5 -apple-system,Inter,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:fixed;z-index:10;background:rgba(0,0,0,.46);backdrop-filter:blur(10px);
    border:1px solid var(--rule);border-radius:6px;padding:7px 10px;-webkit-user-select:text;user-select:text}
  .hud.br{right:13px;bottom:13px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    color:var(--ink-dim);letter-spacing:.02em;white-space:pre;text-align:right}
  .hud.bl{left:13px;bottom:13px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-faint)}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);font-size:13px;pointer-events:none}
  .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);
    margin-right:6px;vertical-align:middle}
  #rec{position:fixed;left:13px;top:13px;z-index:11;display:none;align-items:center;gap:6px;
    background:rgba(0,0,0,.5);border:1px solid var(--accent);border-radius:6px;padding:5px 9px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink)}
  #rec b{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  /* ── in-viewport transform gizmo toolbar (DCC-style) ── */
  #gizmobar{position:fixed;left:13px;top:13px;z-index:12;display:none;align-items:center;gap:2px;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid var(--rule);
    border-radius:7px;padding:3px;-webkit-user-select:none;user-select:none}
  #gizmobar .gm{display:flex;align-items:center;gap:5px;background:transparent;border:0;
    color:var(--ink-dim);font:600 11px/1 -apple-system,Inter,system-ui,sans-serif;letter-spacing:.02em;
    padding:6px 10px;border-radius:5px;cursor:pointer;transition:background .12s,color .12s}
  #gizmobar .gm:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  #gizmobar .gm.on{color:var(--ink);background:rgba(255,255,255,.08);box-shadow:inset 0 -2px 0 var(--accent)}
  #gizmobar .gm .k{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--ink-faint);
    border:1px solid var(--rule);border-radius:3px;padding:1px 3px;line-height:1}
  #gizmobar .gm.on .k{color:var(--ink-dim)}
  #gizmobar .gm .i{width:13px;height:13px;flex:0 0 auto}
  /* ── export-frame guide (FIX 1) ── the canvas is sized to the active export
     aspect and centred; #frameguide traces that rectangle and dims outside it, so
     the user composes inside the real exported frame. Only shown when an aspect is
     locked (a pose-from-image source is active); full-window otherwise. ── */
  #stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #frameguide{position:fixed;z-index:8;pointer-events:none;display:none;border:1px solid var(--accent);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.42);border-radius:2px}
  #frameguide::before,#frameguide::after{content:"";position:absolute;width:14px;height:14px;
    border:1px solid rgba(233,234,236,.5)}
  #frameguide::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  #frameguide::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  body.framed #frameguide{display:block}
  #aspectpill{position:fixed;top:13px;left:50%;transform:translateX(-50%);z-index:11;display:none;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid var(--rule);border-radius:999px;
    padding:5px 12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.06em;
    color:var(--ink-dim);text-transform:uppercase;-webkit-user-select:text;user-select:text;white-space:nowrap}
  body.framed #aspectpill{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg">Building the stage…</div>
<div id="rec"><b></b>Recording move…</div>
<div id="frameguide" aria-hidden="true"></div>
<div id="aspectpill">—</div>
<div id="gizmobar" role="toolbar" aria-label="Transform gizmo mode">
  <button class="gm" data-gm="translate" title="Move — W">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2 9 5M12 2l3 3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3M12 22l-3-3M12 22l3-3"/></svg>
    <span>Move</span><span class="k">W</span></button>
  <button class="gm" data-gm="rotate" title="Rotate — E">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
    <span>Rotate</span><span class="k">E</span></button>
  <button class="gm" data-gm="scale" title="Scale — R">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/></svg>
    <span>Scale</span><span class="k">R</span></button>
</div>
<div class="hud br"><span id="cam">—</span></div>
<div class="hud bl"><span class="pip"></span>drag = orbit + height · scroll = dolly · click = select · right-drag = pan · gizmo: W/E/R</div>

<script type="importmap">{ "imports": { "three": "../world/vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { TransformControls } from '../world/vendor/TransformControls.js';
import { buildMannequin } from './mannequin.js';

const SENSOR_W = 36, SENSOR_H = 24;
const LENS_PRIMES = [8, 14, 24, 35, 50, 85, 100, 135, 200];
const LENS_CODE = { 8:'8mm fisheye', 14:'14mm ultra-wide', 24:'24mm wide', 35:'35mm', 50:'50mm normal',
  85:'85mm portrait', 100:'100mm', 135:'135mm tele', 200:'200mm long' };
const SHOT_BANDS = [['ECU',0.20],['CU',0.35],['MCU',0.50],['MS',0.75],['MLS',0.95],['LS',1.30],['WS',2.50]];
const COCO = ['nose','left_eye','right_eye','left_ear','right_ear','left_shoulder','right_shoulder',
  'left_elbow','right_elbow','left_wrist','right_wrist','left_hip','right_hip',
  'left_knee','right_knee','left_ankle','right_ankle'];
const SKELETON = [[15,13],[13,11],[16,14],[14,12],[11,12],[5,11],[6,12],[5,6],
  [5,7],[6,8],[7,9],[8,10],[0,1],[0,2],[1,3],[2,4],[0,5],[0,6]];
const LIMB_COLOR = ['#3b6fff','#3b8bff','#ff8a3b','#ffb03b','#c46bff','#6b8bff','#ff6b8b','#ffd23b',
  '#3bd6ff','#3bffb0','#3bff6b','#b0ff3b','#ff3b6b','#ff3bb0','#ff6bff','#b03bff','#6bffd6','#6bff8b'];

const stage = document.getElementById('stage'), msg = document.getElementById('msg');
const camEl = document.getElementById('cam'), recEl = document.getElementById('rec');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101113);
const sceneFog = new THREE.Fog(0x101113, 26, 60); scene.fog = sceneFog;
const camera = new THREE.PerspectiveCamera(37.8, innerWidth / innerHeight, 0.03, 2000);

scene.add(new THREE.HemisphereLight(0xdfe6ef, 0x1c1e22, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb4c9, 0.4); fill.position.set(-6, 4, -3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xbfe0ff, 0.3); rim.position.set(-2, 5, -8); scene.add(rim);

// ── the built stage ──
function checkerTexture(){
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'); g.fillStyle = '#17181b'; g.fillRect(0, 0, N, N);
  g.fillStyle = '#202226';
  for (let y=0;y<8;y++) for (let x=0;x<8;x++) if ((x+y)%2) g.fillRect(x*N/8, y*N/8, N/8, N/8);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(20, 20); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ map: checkerTexture(), roughness: 1, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, 0x3b3e44, 0x25272b); grid.position.y = 0.002; scene.add(grid);
const axes = new THREE.AxesHelper(1.2); axes.position.y = 0.004; scene.add(axes);

const clay = () => new THREE.MeshStandardMaterial({ color: 0x9198a1, roughness: 0.85, metalness: 0 });
const clayDark = () => new THREE.MeshStandardMaterial({ color: 0x6d747d, roughness: 0.95, metalness: 0 });

// ── objects registry ──
let objects = [];
let idSeq = 0, selectedId = null, boxHelper = null;
function primaryMann(){ return objects.find(o => o.type === 'mannequin'); }
function getObj(id){ return objects.find(o => o.id === id); }

// ── the human stand-in (real rigged GLB) lives in ./mannequin.js ──
// buildMannequin(height) → { group, nodes, height, pose, setPose, setHeight, cocoWorld }
// It replaces the old procedural clay figure; cocoWorld() stays exact (reads bone world pos).

// ── object proxies + mirror (CubeCamera) ──
let mirrors = [];
function buildProp(type){
  const g = new THREE.Group(); const mark = m => { m.userData.pick = true; return m; };
  if (type === 'wall'){ const w = mark(new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.7, 0.16), clay())); w.position.y = 1.35; g.add(w); }
  else if (type === 'window'){
    const W=1.4,H2=1.6,t=0.12,fr=clayDark(), frame=new THREE.Group();
    const bar=(w,h,x,y)=>{ const m=mark(new THREE.Mesh(new THREE.BoxGeometry(w,h,t),fr)); m.position.set(x,y,0); return m; };
    frame.add(bar(W+0.2,0.18,0,H2/2), bar(W+0.2,0.18,0,-H2/2), bar(0.18,H2,-W/2,0), bar(0.18,H2,W/2,0), bar(0.1,H2,0,0), bar(W,0.1,0,0));
    frame.position.y = 1.4; g.add(frame);
  } else if (type === 'car'){
    const body=mark(new THREE.Mesh(new THREE.BoxGeometry(4.1,0.9,1.8), clay())); body.position.y=0.55;
    const cabin=mark(new THREE.Mesh(new THREE.BoxGeometry(2.2,0.7,1.66), clayDark())); cabin.position.set(-0.2,1.15,0); g.add(body,cabin);
    for (const [x,z] of [[1.35,0.9],[1.35,-0.9],[-1.35,0.9],[-1.35,-0.9]]){
      const wheel=mark(new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,18), clayDark())); wheel.rotation.x=Math.PI/2; wheel.position.set(x,0.4,z); g.add(wheel);
    }
  } else if (type === 'shop'){
    const facade=mark(new THREE.Mesh(new THREE.BoxGeometry(4.2,3.2,0.3), clay())); facade.position.y=1.6;
    const door=mark(new THREE.Mesh(new THREE.BoxGeometry(1.2,2.2,0.34), new THREE.MeshStandardMaterial({color:0x111316,roughness:1}))); door.position.set(0,1.1,0.02);
    const sign=mark(new THREE.Mesh(new THREE.BoxGeometry(3.2,0.6,0.36), clayDark())); sign.position.set(0,2.9,0.02);
    g.add(facade,door,sign);
  } else if (type === 'mirror'){ return buildMirror(g); }
  return { group: g };
}
function buildMirror(g){
  const rt = new THREE.WebGLCubeRenderTarget(256, { generateMipmaps:true, minFilter: THREE.LinearMipmapLinearFilter });
  const cubeCam = new THREE.CubeCamera(0.1, 100, rt);
  const W=1.4,H2=2.0;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W,H2), new THREE.MeshStandardMaterial({ envMap: rt.texture, metalness: 1.0, roughness: 0.02, color: 0xffffff }));
  glass.userData.pick = true;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W+0.16, H2+0.16, 0.08), clayDark()); frame.position.z = -0.05; frame.userData.pick = true;
  const holder = new THREE.Group(); holder.add(frame, glass); holder.position.y = H2/2 + 0.05;
  g.add(holder, cubeCam);
  const mirror = { cubeCam, glass }; mirrors.push(mirror);
  return { group: g, mirror };
}
function updateMirrors(){ for (const m of mirrors){ m.glass.visible=false; m.glass.getWorldPosition(m.cubeCam.position); m.cubeCam.update(renderer, scene); m.glass.visible=true; } }

// ── add / select / delete ──
// opts.id forces a specific id (session restore preserves ids so timeline tracks
// re-bind); opts.noSelect skips the auto-select (restore selects once at the end).
async function addObject(type, opts){
  opts = opts || {};
  const id = opts.id || ('obj-' + (idSeq++).toString(36));
  if (opts.id){ const nSeq = parseInt(String(opts.id).replace('obj-',''), 36); if (!isNaN(nSeq)) idSeq = Math.max(idSeq, nSeq + 1); }
  let rec;
  if (type === 'mannequin'){
    const mann = await buildMannequin(figH);
    rec = { id, type, group: mann.group, mann, nodes: mann.nodes, poseInput: { kind:'preset', name:'stand' } };
    const n = objects.filter(o => o.type==='mannequin').length; mann.group.position.x = n * 0.9;
  } else {
    const built = buildProp(type);
    rec = { id, type, group: built.group, mirror: built.mirror };
    const n = objects.filter(o => o.type===type).length; rec.group.position.set(1.7 + n*0.4, 0, -1.3);
  }
  scene.add(rec.group); objects.push(rec); if (!opts.noSelect) select(id); postScene(); return rec;
}
// Remove every object + mirror + timeline track and clear selection/gizmo — the
// pre-step for a session restore or a fresh scene.
function clearAllObjects(){
  for (const o of objects.slice()){ if (o.mirror) mirrors = mirrors.filter(mm => mm !== o.mirror); scene.remove(o.group); }
  objects = []; tlObj = {}; tlCam = []; selKey = null; selectedId = null;
  if (boxHelper){ scene.remove(boxHelper); boxHelper = null; }
  detachGizmo();
}
function deleteObject(id){
  const o = getObj(id); if (!o) return;
  if (o.mirror) mirrors = mirrors.filter(m => m !== o.mirror);
  delete tlObj[id];
  scene.remove(o.group); objects = objects.filter(x => x.id !== id);
  if (selectedId === id){ selectedId = null; if (boxHelper){ scene.remove(boxHelper); boxHelper = null; } detachGizmo(); }
  postScene(); postTimeline();
}
function select(id){
  selectedId = id;
  if (boxHelper){ scene.remove(boxHelper); boxHelper = null; }
  const o = getObj(id); if (o){ boxHelper = new THREE.BoxHelper(o.group, 0xF25502); scene.add(boxHelper); attachGizmo(id); } else detachGizmo();
  post('hjen:fs-select', selInfo()); postScene(); postTimeline();
}
function selInfo(){
  const o = getObj(selectedId); if (!o) return null;
  return { id:o.id, type:o.type, px:+o.group.position.x.toFixed(3), py:+o.group.position.y.toFixed(3), pz:+o.group.position.z.toFixed(3),
    rx: Math.round(THREE.MathUtils.radToDeg(o.group.rotation.x)), ry: Math.round(THREE.MathUtils.radToDeg(o.group.rotation.y)), rz: Math.round(THREE.MathUtils.radToDeg(o.group.rotation.z)), scale:+o.group.scale.x.toFixed(3),
    isMann:o.type==='mannequin', pose: o.mann ? o.mann.pose : null };
}
function postScene(){ post('hjen:fs-scene', { objects: objects.map(o => ({ id:o.id, type:o.type, selected:o.id===selectedId })), selected: selInfo() }); }

// ── focal-true camera + orbit framing ──
let focalMm = 50, figH = 1.75;
function focalToVFov(mm){ return 2 * Math.atan((SENSOR_H/2)/mm) * 180 / Math.PI; }
function setFocal(mm){ focalMm = Math.max(8, Math.min(400, mm)); camera.fov = focalToVFov(focalMm); camera.updateProjectionMatrix(); apply(); }
function nearestLens(mm){ return LENS_PRIMES.reduce((a,b)=>Math.abs(b-mm)<Math.abs(a-mm)?b:a); }
let orbit = { yaw:0, dist:3.6, camY:1.08, target:new THREE.Vector3(0,1.05,0) };
function frameTarget(){ const m=primaryMann(); const H=m?m.mann.height:figH; return new THREE.Vector3(m?m.group.position.x:0, 0.62*H, m?m.group.position.z:0); }
function apply(){
  const t=orbit.target, dy=orbit.camY-t.y, rH=Math.sqrt(Math.max(0.0004, orbit.dist*orbit.dist-dy*dy));
  camera.position.set(t.x+rH*Math.sin(orbit.yaw), orbit.camY, t.z+rH*Math.cos(orbit.yaw));
  camera.lookAt(t); updateHud(); pushReadout();
  rekeySelectedCam();   // live-editing a selected camera key via drag / sliders
}
// Reverse-derive the orbit rig from a free camera pose so the orbit sliders keep
// working after we snap to a keyframe. apply() then reconstructs pos/tgt exactly.
function syncOrbitFromCam(pos,tgt,fov){
  orbit.target.copy(tgt);
  orbit.camY=pos.y;
  orbit.dist=Math.max(0.001, pos.distanceTo(tgt));
  orbit.yaw=Math.atan2(pos.x-tgt.x, pos.z-tgt.z);
  const mm=(SENSOR_H/2)/Math.tan(THREE.MathUtils.degToRad(fov)/2);
  focalMm=THREE.MathUtils.clamp(mm,8,400); camera.fov=focalToVFov(focalMm); camera.updateProjectionMatrix();
}
function shotSizeFor(dist){ const visH=2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2), r=visH/figH; for (const [c,thr] of SHOT_BANDS) if (r<thr) return c; return 'EWS'; }
function angleCodeFor(){ const elev=Math.asin(THREE.MathUtils.clamp((orbit.camY-orbit.target.y)/orbit.dist,-1,1))*180/Math.PI;
  if (Math.abs(elev)<10) return 'EL'; if (elev>=65) return 'OH'; if (elev>=10) return 'HA'; if (elev<=-40) return 'WE'; return 'LA'; }
function readout(){ const prime=nearestLens(focalMm);
  return { focalMm:Math.round(focalMm), lensPrime:prime, lensCode:LENS_CODE[prime], shotCode:shotSizeFor(orbit.dist), angleCode:angleCodeFor(), distanceM:+orbit.dist.toFixed(3), camHeight:+orbit.camY.toFixed(3), figureHeight:figH }; }
function updateHud(){ const r=readout(); camEl.textContent = `${r.focalMm}mm (≈${r.lensPrime}mm) · ${r.shotCode} · ${r.angleCode}\n${r.distanceM.toFixed(2)} m · cam ${r.camHeight.toFixed(2)} m`; }
function post(type,data){ parent && parent.postMessage({ type, data }, '*'); }
let readoutT = 0;
function pushReadout(){ clearTimeout(readoutT); readoutT = setTimeout(()=>post('hjen:fs-readout', readout()), 30); }
function camPose(){ const t=orbit.target.clone(), dy=orbit.camY-t.y, rH=Math.sqrt(Math.max(0.0004,orbit.dist*orbit.dist-dy*dy));
  return { pos:new THREE.Vector3(t.x+rH*Math.sin(orbit.yaw), orbit.camY, t.z+rH*Math.cos(orbit.yaw)), tgt:t, fov:camera.fov }; }

// ── input ──
let dragging=false, panning=false, lx=0, ly=0, moved=0;
let transformControls=null, gizmoMode='translate', gizmoDragging=false;   // set up below the picker
const onGizmo = () => transformControls && (transformControls.dragging || transformControls.axis);
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
// Left-drag begins an orbit ONLY when the pointer is not over a gizmo handle — the
// gizmo owns the drag then, and orbit/pan must not fight it (item 5).
renderer.domElement.addEventListener('mousedown', e => { dragging=e.button===0 && !onGizmo(); panning=e.button===2 && !onGizmo(); lx=e.clientX; ly=e.clientY; moved=0; });
addEventListener('mouseup', e => { if (e.button===0 && moved<5 && !gizmoDragging && !onGizmo()) pickAt(e.clientX, e.clientY); dragging=panning=false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (!dragging && !panning || gizmoDragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if (dragging){ orbit.yaw += dx*0.005; orbit.camY = THREE.MathUtils.clamp(orbit.camY - dy*0.006, 0.05, figH*2.6); }
  else if (panning){ const s=orbit.dist*0.0016; orbit.target.x=THREE.MathUtils.clamp(orbit.target.x-dx*s,-6,6); orbit.target.y=THREE.MathUtils.clamp(orbit.target.y+dy*s,0.1,figH*1.6); }
  apply();
});
addEventListener('wheel', e => { orbit.dist=THREE.MathUtils.clamp(orbit.dist+e.deltaY*0.0022*orbit.dist,0.6,30); apply(); }, { passive:true });
addEventListener('resize', () => { if (capturing||recording) return; fitViewport(); });
function pickAt(cx, cy){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc, camera);
  const meshes = []; objects.forEach(o => o.group.traverse(m => { if (m.isMesh && m.userData.pick){ m.userData.__obj=o.id; meshes.push(m);} }));

// A preset SEEDS the camera track: sample its plan into visible, draggable keys.
// Curved moves (orbit / arc / heli / handheld / snorricam) get intermediates so the
// interpolated path reads true; everything else is a clean start → end pair.
function seedPreset(motion){
  const plan=buildPlan(motion);
  const curved = plan.special && ['orbCw','orbCcw','arcL','arcR','heli','hand','snorri'].includes(plan.special);
  const N = curved ? 7 : 2;
  tlCam = []; selKey = null;
  for (let i=0;i<N;i++){ const t=i/(N-1); const p=poseAt(plan,t,true);
    tlCam.push({ id:'k'+(kfSeq++), t, pos:p.pos.clone(), tgt:p.tgt.clone(), fov:p.fov }); }
  head=0; applyActiveAt(0); postTimeline();
}
// Snap the playhead to a keyframe AND make it editable: for camera keys we re-derive
// the orbit rig so the sliders/drag continue smoothly (and live-rekey this key).
function seekKey(track,id){
  const arr = track==='camera'?tlCam:tlObj[track]; if(!arr) return;
  const k=arr.find(x=>x.id===id); if(!k) return;
  selKey={ track, id }; head=k.t;
  if (track==='camera'){ syncOrbitFromCam(k.pos,k.tgt,k.fov); apply(); }
  else { applyActiveAt(head); }
  postTimeline();
}

function postTimeline(){
  post('hjen:fs-timeline', { duration, head:+head.toFixed(4), selKey,
    camera: tlCam.map(k=>({ id:k.id, t:+k.t.toFixed(4) })),
    objectId: selectedId, object: (selectedId&&tlObj[selectedId]) ? tlObj[selectedId].map(k=>({ id:k.id, t:+k.t.toFixed(4) })) : [] });
}
function addKey(track){

  else { const o=getObj(track); if(!o) return; if(!tlObj[track])tlObj[track]=[]; tlObj[track]=tlObj[track].filter(k=>Math.abs(k.t-head)>0.02);
    tlObj[track].push({ id, t:head, px:o.group.position.x, py:o.group.position.y, pz:o.group.position.z, rx:THREE.MathUtils.radToDeg(o.group.rotation.x), ry:THREE.MathUtils.radToDeg(o.group.rotation.y), rz:THREE.MathUtils.radToDeg(o.group.rotation.z), scale:o.group.scale.x }); }

function delKey(track,id){ if (track==='camera') tlCam=tlCam.filter(k=>k.id!==id); else if (tlObj[track]) tlObj[track]=tlObj[track].filter(k=>k.id!==id); if (selKey&&selKey.id===id) selKey=null; postTimeline(); }

function seekTo(u){ head=THREE.MathUtils.clamp(u,0,1); applyActiveAt(head); postTimeline(); }

// real-time playback — renders EVERY frame (the Phase-2 bug was: it didn't render live)
let playHandle=0;
function stopMove(){ playing=false; if (playHandle) cancelAnimationFrame(playHandle); playHandle=0; if (transformControls && selectedId) transformControls.enabled=true; }
function playMove(loop){
  if (!hasMoveContent()){ post('hjen:fs-play',{ ok:false, reason:'no-move' }); return; }
  stopMove(); playing=true; if (transformControls) transformControls.enabled=false; const t0=performance.now();
  (function step(){
    if (!playing) return;
    let el=(performance.now()-t0)/(duration*1000);
    if (el>=1 && !loop){ head=1; applyActiveAt(1); updateMirrors(); renderer.render(scene,camera); playing=false; postTimeline(); post('hjen:fs-play',{ ok:true, done:true }); return; }
    head = loop ? (el%1) : Math.min(el,1);
    applyActiveAt(head); updateMirrors(); renderer.render(scene,camera);   // ← interpolate the timeline live, every frame
    post('hjen:fs-playhead', { head:+head.toFixed(4) });
    playHandle=requestAnimationFrame(step);
  })();

function pickRecMime(){ for (const m of ['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; return 'video/webm'; }

    const mime=pickRecMime(), stream=renderer.domElement.captureStream(30), rec=new MediaRecorder(stream,{ mimeType:mime, videoBitsPerSecond:5_000_000 });
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); const fr=new FileReader(); fr.onload=()=>resolve({ dataUrl:fr.result, mime }); fr.readAsDataURL(blob); };
    const gzWas=transformControls.visible; transformControls.visible=false;   // keep the gizmo out of the recorded clip
    recording=true; recEl.style.display='flex'; rec.start(); const t0=performance.now();
    (function step(){ const u=Math.min(1,(performance.now()-t0)/(duration*1000)); applyActiveAt(u); updateMirrors(); renderer.render(scene,camera);
      if (u>=1){ setTimeout(()=>{ rec.stop(); recording=false; recEl.style.display='none'; transformControls.visible=gzWas; }, 160); } else requestAnimationFrame(step); })();

}
// Export EXACTLY the keyframes on the timeline — their times, poses and fov — plus
// per-object tracks. The move's duration_s is the timeline span; key.t (0..1) × span
// is the real time of each key, so dragging keys = retiming = speed control.
function movePath(){
  const keys=sortT(tlCam);
  const path=keys.map(k=>({ t:+k.t.toFixed(4), position:k.pos.toArray().map(n=>+n.toFixed(4)), target:k.tgt.toArray().map(n=>+n.toFixed(4)), fov:+k.fov.toFixed(3) }));
  const subject_path=[];
  for (const objId of Object.keys(tlObj)){ for (const k of sortT(tlObj[objId])) subject_path.push({ obj_id:objId, t:+k.t.toFixed(4), position:[+k.px.toFixed(3),+k.py.toFixed(3),+k.pz.toFixed(3)], rotation_deg:Math.round(k.ry), rotation_deg_xyz:[Math.round(k.rx||0),Math.round(k.ry),Math.round(k.rz||0)], scale:+k.scale.toFixed(3) }); }

}
async function captureMove(){
  if (!hasMoveContent()){ post('hjen:fs-capture', { error:'Add camera keyframes (or pick a movement preset) before locking a move.' }); return; }
  stopMove();
  applyActiveAt(0);
  const still=captureStills();
  const mpath=movePath();
  const clip=await recordMove();
  applyActiveAt(0);
  still.camera.vocab.movement_id = armedMeta ? armedMeta.presetId : 'timeline';
  still.camera.vocab.move_code = armedMeta && armedMeta.kind ? armedMeta.kind : 'keyframes';
  still.camera.move = mpath;

// ── preset thumbnails (camera-only) rendered from OUR stage ──

// ── Pose from image (LOCAL, offline) ──
// A vendored MediaPipe Pose Landmarker (Tasks Vision, WASM + .task) estimates 3D
// body landmarks fully on-device. Everything loads from disk over hjen-file://:
// the wasm loader + binary become blob URLs (script-injected + Emscripten-fetched)
// and the model is fed as an in-memory buffer — ZERO network, CSP-safe under
// file://. worldLandmarks (metric, hips-centred) → mannequin.setPoseFromJoints().
let poseLandmarker = null, poseBusy = false;
const POSE_IDX = { nose:0, left_shoulder:11, right_shoulder:12, left_elbow:13, right_elbow:14,
  left_wrist:15, right_wrist:16, left_hip:23, right_hip:24, left_knee:25, right_knee:26,
  left_ankle:27, right_ankle:28, left_foot:31, right_foot:32 };
async function fetchBytes(url){ const r = await fetch(url); if(!r.ok) throw new Error('fetch '+r.status+' '+url); return r.arrayBuffer(); }
async function initPose(urls){
  if (poseLandmarker) return { ok:true, already:true };
  const [loaderBuf, wasmBuf, modelBuf] = await Promise.all([ fetchBytes(urls.loaderUrl), fetchBytes(urls.wasmUrl), fetchBytes(urls.modelUrl) ]);
  const loaderUrl = URL.createObjectURL(new Blob([loaderBuf], { type:'text/javascript' }));
  const wasmUrl   = URL.createObjectURL(new Blob([wasmBuf],   { type:'application/wasm' }));
  const vision = await import('./assets/pose/vision_bundle.mjs');
  poseLandmarker = await vision.PoseLandmarker.createFromOptions(
    { wasmLoaderPath: loaderUrl, wasmBinaryPath: wasmUrl },
    { baseOptions: { modelAssetBuffer: new Uint8Array(modelBuf) },
      runningMode: 'IMAGE', numPoses: 1, minPoseDetectionConfidence: 0.5, outputSegmentationMasks: false });
  return { ok:true, model:'pose_landmarker_full', modelBytes: modelBuf.byteLength };
}
function loadImage(src){ return new Promise((res, rej) => { const im = new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>rej(new Error('image load failed')); im.src=src; }); }

  if (poseBusy) return; poseBusy = true;

    const initR = await initPose(urls);
    const img = await loadImage(urls.imageUrl);
    const res = poseLandmarker.detect(img);
    const wl = res && res.worldLandmarks && res.worldLandmarks[0];
    if (!wl || !wl.length){ post('hjen:fs-pose', { ok:false, reason:'No person detected in the image.' }); return; }
    const J = {};
    for (const k in POSE_IDX){ const p = wl[POSE_IDX[k]]; if (p) J[k] = { x:p.x, y:p.y, z:p.z, v:(p.visibility!=null?p.visibility:1) }; }
    const pm = (getObj(selectedId) && getObj(selectedId).mann) ? getObj(selectedId) : primaryMann();
    if (!pm || !pm.mann){ post('hjen:fs-pose', { ok:false, reason:'No stand-in on the stage.' }); return; }
    const out = pm.mann.setPoseFromJoints(J);
    if (!out.ok){ post('hjen:fs-pose', { ok:false, reason:out.reason || 'Could not read the pose.', landmarks: wl.length }); return; }
    pm.poseInput = { kind:'joints', J };   // remember the exact input so a session restores this pose
    // The LIMB pose retargets reliably; torso azimuth (yaw) does NOT — it rides on
    // monocular depth, which is ambiguous, so we keep the figure facing the viewer
    // (the right default for posing) and let the existing Rotation slider turn it.
    if (boxHelper) boxHelper.update();

// ── Pose from HMR params (LOCAL, offline) ──

function poseFromParams(params){

    if (boxHelper) boxHelper.update();

// dev diagnostic hook — lets a headless harness prove Phase 1/2 offline in a BUILT

// ── session serialization ──
// A COMPLETE, self-describing snapshot of the stage: every object (transform +
// scale, plus mannequin height and the EXACT pose input — preset name, or the
// image-recovered HMR params / MediaPipe joints so an image-derived pose restores
// identically), the camera rig, mode, export aspect, and the whole keyframe
// timeline. setSceneState rebuilds a stage that looks the same when overlaid.
function getSceneState(){
  const pm = primaryMann();
  return {
    schema: 'hjen.filmspace.session/1',
    objects: objects.map(o => {
      const base = {
        id: o.id, type: o.type,
        px:+o.group.position.x.toFixed(4), py:+o.group.position.y.toFixed(4), pz:+o.group.position.z.toFixed(4),
        rx:+THREE.MathUtils.radToDeg(o.group.rotation.x).toFixed(3),
        ry:+THREE.MathUtils.radToDeg(o.group.rotation.y).toFixed(3),
        rz:+THREE.MathUtils.radToDeg(o.group.rotation.z).toFixed(3),
        scale:+o.group.scale.x.toFixed(4),
      };
      if (o.type === 'mannequin' && o.mann){
        base.height = +o.mann.height.toFixed(4);
        base.pose = o.poseInput || { kind:'preset', name:o.mann.pose || 'stand' };
      }
      return base;
    }),
    selectedId,
    figureHeight: +figH.toFixed(4),
    figureRotation: pm ? +THREE.MathUtils.radToDeg(pm.group.rotation.y).toFixed(3) : 0,
    mode,
    captureAspect: captureAspect ? { w:captureAspect.w, h:captureAspect.h } : null,
    camera: {
      focalMm: +focalMm.toFixed(3), yaw: +orbit.yaw.toFixed(6), dist: +orbit.dist.toFixed(4), camY: +orbit.camY.toFixed(4),
      target: [ +orbit.target.x.toFixed(4), +orbit.target.y.toFixed(4), +orbit.target.z.toFixed(4) ], fov: +camera.fov.toFixed(4),
    },
    timeline: {
      duration: +duration.toFixed(3), head: +head.toFixed(4),
      armedMeta: armedMeta ? { presetId: armedMeta.presetId, kind: armedMeta.kind } : null,
      selKey: selKey ? { track: selKey.track, id: selKey.id } : null,
      camera: tlCam.map(k => ({ id:k.id, t:+k.t.toFixed(4), pos:k.pos.toArray().map(n=>+n.toFixed(4)), tgt:k.tgt.toArray().map(n=>+n.toFixed(4)), fov:+k.fov.toFixed(3) })),
      objects: Object.fromEntries(Object.keys(tlObj).map(id => [id, tlObj[id].map(k => ({ id:k.id, t:+k.t.toFixed(4), px:+(+k.px).toFixed(3), py:+(+k.py).toFixed(3), pz:+(+k.pz).toFixed(3), rx:+(+(k.rx||0)).toFixed(2), ry:+(+k.ry).toFixed(2), rz:+(+(k.rz||0)).toFixed(2), scale:+(+k.scale).toFixed(3) }))])),
    },

}
// Bump the id sequences past any restored ids so freshly-added objects / keyframes
// never collide with a restored id.
function bumpSeqs(){
  for (const o of objects){ const n=parseInt(String(o.id).replace('obj-',''),36); if(!isNaN(n)) idSeq=Math.max(idSeq,n+1); }
  const ks=[...tlCam.map(k=>k.id), ...Object.values(tlObj).reduce((a,b)=>a.concat(b),[]).map(k=>k.id)];
  for (const id of ks){ const mt=/^k(\d+)$/.exec(String(id)); if(mt) kfSeq=Math.max(kfSeq, parseInt(mt[1],10)+1); }

async function setSceneState(s){
  if (!s) return;
  stopMove();
  clearAllObjects();
  // rebuild objects, preserving ids so the timeline tracks re-bind
  for (const od of (s.objects || [])){
    const rec = await addObject(od.type, { id: od.id, noSelect: true });
    if (!rec) continue;
    rec.group.position.set(od.px||0, od.py||0, od.pz||0);
    rec.group.rotation.set(THREE.MathUtils.degToRad(od.rx||0), THREE.MathUtils.degToRad(od.ry||0), THREE.MathUtils.degToRad(od.rz||0));
    rec.group.scale.setScalar(od.scale || 1);
    if (rec.mann){
      if (od.height) rec.mann.setHeight(od.height);   // re-applies the current pose at the new scale
      const pi = od.pose;
      try {
        if (pi && pi.kind === 'params') rec.mann.setPoseFromParams(pi.params);
        else if (pi && pi.kind === 'joints') rec.mann.setPoseFromJoints(pi.J);
        else if (pi && pi.kind === 'preset') rec.mann.setPose(pi.name || 'stand');
        else if (typeof pi === 'string') rec.mann.setPose(pi);
      } catch(err){ /* fall back to whatever the build left */ }
      rec.poseInput = pi || { kind:'preset', name: rec.mann.pose || 'stand' };
    }
  }
  if (s.figureHeight) figH = s.figureHeight;

  const tcam = (s.timeline && s.timeline.camera) || [];
  tlCam = tcam.map(k => ({ id:k.id, t:k.t, pos:new THREE.Vector3(k.pos[0],k.pos[1],k.pos[2]), tgt:new THREE.Vector3(k.tgt[0],k.tgt[1],k.tgt[2]), fov:k.fov }));
  tlObj = {};
  const tobj = (s.timeline && s.timeline.objects) || {};
  for (const id in tobj) tlObj[id] = tobj[id].map(k => ({ ...k }));
  duration = (s.timeline && s.timeline.duration) || 5;
  armedMeta = (s.timeline && s.timeline.armedMeta) ? { presetId:s.timeline.armedMeta.presetId, kind:s.timeline.armedMeta.kind } : null;
  head = (s.timeline && s.timeline.head) || 0;
  selKey = (s.timeline && s.timeline.selKey) || null;
  bumpSeqs();
  // mode + export aspect
  mode = s.mode || 'frame';
  setCaptureAspect(s.captureAspect ? s.captureAspect.w : 0, s.captureAspect ? s.captureAspect.h : 0);
  // camera rig — restore the free-orbit pose the snapshot was framed at
  if (s.camera){
    orbit.yaw = s.camera.yaw || 0; orbit.dist = s.camera.dist || 3.6; orbit.camY = s.camera.camY || 1.08;
    orbit.target.set(s.camera.target[0], s.camera.target[1], s.camera.target[2]);
    setFocal(s.camera.focalMm || 50);   // calls apply()
  } else apply();
  // selection + gizmo
  selectedId = null;
  if (s.selectedId && getObj(s.selectedId)) select(s.selectedId);
  else post('hjen:fs-select', null);
  post('hjen:fs-armed', { presetId: armedMeta ? armedMeta.presetId : null });
  postScene(); postTimeline(); pushReadout();
}
// A fresh stage: one primary stand-in, default camera, empty timeline, frame mode.

    transformControls.visible=gzWas; if (boxHelper) boxHelper.visible=bWas;
    renderer.setPixelRatio(prevPR); fitViewport(); apply();
    return url;
  } catch(err){ return null; }
}

// ── host protocol ──
addEventListener('message', e => {
  const m=e.data; if (!m || !m.cmd) return;
  switch(m.cmd){
    case 'setFocal': setFocal(m.mm); break;
    case 'setCamHeight': orbit.camY=THREE.MathUtils.clamp(m.y,0.05,figH*2.6); apply(); break;
    case 'setDistance': orbit.dist=THREE.MathUtils.clamp(m.d,0.6,30); apply(); break;
    case 'setFigureHeight': {
      figH=THREE.MathUtils.clamp(m.h,0.6,2.4); const pm=primaryMann();
      if (pm && pm.mann){ pm.mann.setHeight(figH); if (selectedId===pm.id && boxHelper) boxHelper.update(); }
      orbit.target=frameTarget(); apply(); break; }
    case 'setFigureRotation': { const pm=primaryMann(); if (pm) pm.group.rotation.y=THREE.MathUtils.degToRad(m.deg); if (boxHelper) boxHelper.update(); apply(); postScene(); break; }
    case 'setPose': { const o=(getObj(selectedId)&&getObj(selectedId).mann)?getObj(selectedId):primaryMann(); if (o&&o.mann){ o.mann.setPose(m.pose); o.poseInput={ kind:'preset', name:m.pose }; if (boxHelper) boxHelper.update(); } apply(); postScene(); break; }
    case 'addObject': addObject(m.objType); break;
    case 'deleteObject': deleteObject(m.id); break;
    case 'selectObject': select(m.id); break;
    case 'setObjTransform': { const o=getObj(m.id); if (o){ if(m.px!=null)o.group.position.x=m.px; if(m.py!=null)o.group.position.y=m.py; if(m.pz!=null)o.group.position.z=m.pz; if(m.rx!=null)o.group.rotation.x=THREE.MathUtils.degToRad(m.rx); if(m.ry!=null)o.group.rotation.y=THREE.MathUtils.degToRad(m.ry); if(m.rz!=null)o.group.rotation.z=THREE.MathUtils.degToRad(m.rz); if(m.scale!=null)o.group.scale.setScalar(m.scale); if (boxHelper) boxHelper.update(); if (o.type==='mannequin') orbit.target=frameTarget(); apply(); postScene();
      // live-edit a selected object key with the Transform sliders
      if (selKey && selKey.track===m.id){ const arr=tlObj[m.id]; const k=arr&&arr.find(x=>x.id===selKey.id);
        if (k && Math.abs(k.t-head)<0.03){ k.px=o.group.position.x; k.py=o.group.position.y; k.pz=o.group.position.z; k.rx=THREE.MathUtils.radToDeg(o.group.rotation.x); k.ry=THREE.MathUtils.radToDeg(o.group.rotation.y); k.rz=THREE.MathUtils.radToDeg(o.group.rotation.z); k.scale=o.group.scale.x; postTimeline(); } }
    } break; }
    case 'setCaptureAspect': setCaptureAspect(m.w, m.h); break;
    case 'clearCaptureAspect': setCaptureAspect(0, 0); break;
    case 'setMode': mode=m.mode; if (mode==='frame') stopMove(); break;
    case 'setDuration': duration=THREE.MathUtils.clamp(m.sec,2,20); postTimeline(); break;
    case 'armPreset': armedMeta={ presetId:m.presetId, kind:m.motion&&m.motion.kind }; seedPreset(m.motion); post('hjen:fs-armed',{ presetId:m.presetId }); break;
    case 'clearMove': armedMeta=null; clearTimeline(); stopMove(); apply(); post('hjen:fs-armed',{ presetId:null }); break;
    case 'addKey': addKey(m.track); break;
    case 'delKey': delKey(m.track, m.id); break;
    case 'moveKey': moveKey(m.track, m.id, m.t); break;
    case 'selectKey': selKey = m.id ? { track:m.track, id:m.id } : null; break;
    case 'seekKey': seekKey(m.track, m.id); break;
    case 'seek': seekTo(m.u); break;
    case 'clearTimeline': clearTimeline(); break;
    case 'playMove': playMove(m.loop!==false); break;
    // On stop, adopt the current playback pose into the orbit rig BEFORE apply() so
    // the frame is held (no snap back to the pre-play framing) and later edits are smooth.
    case 'stopMove': { const s=sampleTLCam(head); if (s) syncOrbitFromCam(camera.position.clone(), s.tgt, camera.fov); stopMove(); apply(); break; }
    case 'reset': stopMove(); armedMeta=null; selKey=null; clearTimeline(); orbit={ yaw:0, dist:3.6, camY:1.08, target:frameTarget() }; { const pm=primaryMann(); if (pm){ pm.group.rotation.y=0; pm.mann.setPose('stand'); pm.poseInput={ kind:'preset', name:'stand' }; } } setFocal(50); postScene(); break;
    case 'getSceneState': { const state=getSceneState(); const thumb = (m.withThumb!==false) ? captureThumb() : null; post('hjen:fs-scene-state', { token:m.token, state, thumb }); break; }
    case 'setSceneState': setSceneState(m.state); break;
    case 'newScene': newScene(); break;
    case 'initPose': initPose(m.urls).then(r=>post('hjen:fs-pose-init',{ ok:true, ...r })).catch(err=>post('hjen:fs-pose-init',{ ok:false, reason:String((err&&err.message)||err) })); break;
    case 'poseFromImage': poseFromImage(m.urls); break;
    case 'poseFromParams': poseFromParams(m.params); break;
    case 'renderPresetThumbs': renderPresetThumbs(m.list||[]); break;
    case 'capture': if (mode==='move') captureMove(); else post('hjen:fs-capture', captureStills()); break;
  }
});
window.__filmspace = { addObject, captureStills, status:()=>({ ready:true, objects:objects.length }),
  // dev diagnostic: confirms the GLB rig mapped and the COCO-17 joints resolve
  debug:()=>{ const m=primaryMann(); if(!m||!m.mann) return null; const b=m.mann.bones||{};
    const coco=m.mann.cocoWorld(); const c={}; for(const k in coco){ const v=coco[k]; c[k]=[+v.x.toFixed(2),+v.y.toFixed(2),+v.z.toFixed(2)]; }
    return { bones:Object.keys(b), missing:['shoulderL','shoulderR','hipL','kneeL','ankleL','elbowL','wristL','head'].filter(k=>!b[k]), coco:c }; },
  // dev diagnostic: CSS-pixel screen positions of the selected object's gizmo — its
  // origin and the +X/+Y/+Z axis tips ~0.9m out — so a headless harness can aim a
  // drag at a real handle. Returns null when nothing is selected.
  gizmo:()=>{ const o=getObj(selectedId); if(!o||!transformControls.visible) return null;
    const proj=v=>{ const p=v.clone().project(camera); return { x:+((p.x*0.5+0.5)*innerWidth).toFixed(1), y:+((-p.y*0.5+0.5)*innerHeight).toFixed(1) }; };
    const c=o.group.position.clone(), L=0.9;
    return { mode:transformControls.mode, origin:proj(c),
      x:proj(c.clone().add(new THREE.Vector3(L,0,0))), y:proj(c.clone().add(new THREE.Vector3(0,L,0))), z:proj(c.clone().add(new THREE.Vector3(0,0,L))) }; } };

// ── boot ──
await addObject('mannequin'); if (objects[0]) objects[0].isPrimary = true;
selectedId = null; if (boxHelper){ scene.remove(boxHelper); boxHelper = null; }
orbit.target = frameTarget(); setFocal(50);
msg.style.display='none'; post('hjen:fs-ready', readout()); postScene(); postTimeline();
(function loop(){ if (!capturing && !recording && !playing){ updateMirrors(); renderer.render(scene,camera); } requestAnimationFrame(loop); })();
</script>
