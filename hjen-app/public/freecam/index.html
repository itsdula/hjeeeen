<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HJEN Free Camera — Splat Viewer</title>
<!--
  Component 1: open a 3DGS .ply, orbit to the angle you want,
  then "Capture" → downloads frame.png + camera.json. The frame feeds the
  gpt-image-2 lock (Component 2). Runs in any browser (WebGL) — no GPU train.
  Three + gaussian-splats-3d are VENDORED in ./vendor/ — fully offline, no CDN.
  (Historical note: the old CDN import used a wrong package name
  "@mkkellogg/gaussian-splats3d" — correct is "gaussian-splats-3d" — so the
  CDN version never actually loaded. Fixed 2026-07-04, Phase-0 0b.)
-->
<style>
  :root{ --bg:#000; --paper:#F5F5F5; --signal:#D1B310; --ink-40:rgba(245,245,245,.4); --rule:rgba(245,245,245,.16); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--paper);font:14px/1.5 -apple-system,Inter,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:fixed;z-index:10;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);border:1px solid var(--rule);border-radius:8px;padding:14px}
  .tl{top:16px;left:16px;max-width:300px}
  .tr{top:16px;right:16px;text-align:right}
  .bl{bottom:16px;left:16px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-40);letter-spacing:.04em}
  h1{font:700 15px/1.2 Inter,sans-serif;letter-spacing:-.01em;margin-bottom:4px}
  .sub{color:var(--ink-40);font-size:12px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  button,label.btn{font:600 13px Inter,sans-serif;border-radius:5px;padding:9px 14px;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--paper);transition:.15s}
  button:hover,label.btn:hover{border-color:var(--paper)}
  .primary{background:var(--paper);color:#000;border-color:var(--paper)}
  .primary:hover{transform:translateY(-1px)}
  .signal{background:var(--signal);color:#000;border-color:var(--signal)}
  input[type=file]{display:none}
  .pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--signal);margin-right:7px;vertical-align:middle}
  #err{color:#E41A2F;margin-top:8px;font-size:12px;display:none}
  #status{color:var(--signal);font-size:12px;margin-top:8px}
  kbd{font-family:ui-monospace,monospace;font-size:11px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel tl">
  <h1><span class="pip"></span>Free Camera</h1>
  <div class="sub">Open a 3DGS <kbd>.ply</kbd> from KIRI · orbit to the angle · capture the frame.</div>
  <div class="row">
    <label class="btn primary">Open .ply<input id="file" type="file" accept=".ply,.splat,.ksplat"></label>
    <button id="cap" class="signal" disabled>Capture frame</button>
  </div>
  <div id="status"></div>
  <div id="err"></div>
</div>

<div class="panel tr bl" style="font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7">
  <div id="cam">camera: —</div>
</div>

<div class="panel bl" style="left:16px;bottom:16px">
  drag = orbit · scroll = dolly · right-drag = pan
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js"
}}
</script>

<script type="module">
import * as THREE from 'three';
import * as GaussianSplats3D from './vendor/gaussian-splats-3d.module.js';

const stage = document.getElementById('stage');
const errEl = document.getElementById('err');
const statusEl = document.getElementById('status');
const camEl = document.getElementById('cam');
const capBtn = document.getElementById('cap');

// preserveDrawingBuffer:true is REQUIRED to read pixels for capture.
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 4);

let viewer = null;

function fmt(v){ return `[${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)}]`; }
function tick(){
  const t = viewer?.controls?.target ?? new THREE.Vector3();
  camEl.textContent =
    `pos ${fmt(camera.position)}\ntarget ${fmt(t)}\nfov ${camera.fov}°`;
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

async function load(url, revoke){
  errEl.style.display = 'none';
  statusEl.textContent = 'Loading splat…';
  try{
    if (viewer){ try{ viewer.dispose(); }catch(e){} stage.querySelectorAll('canvas').forEach((c,i)=>{ if(i>0) c.remove(); }); }
    viewer = new GaussianSplats3D.Viewer({
      renderer, camera,
      useBuiltInControls: true,
      selfDrivenMode: true,
      sharedMemoryForWorkers: false,   // safer default for file://
      rootElement: stage,
    });
    await viewer.addSplatScene(url, { showLoadingUI: true, splatAlphaRemovalThreshold: 5 });
    viewer.start();
    capBtn.disabled = false;
    statusEl.textContent = 'Loaded. Orbit to your angle, then Capture.';
  }catch(e){
    statusEl.textContent = '';
    errEl.style.display = 'block';
    errEl.textContent = 'Load failed: ' + (e?.message || e) + ' — confirm the .ply is a 3DGS file.';
  }finally{
    if (revoke) URL.revokeObjectURL(revoke);
  }
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  load(url, url);
});

// allow ?ply=<url> for app integration (served frame URL)
const q = new URLSearchParams(location.search).get('ply');
if (q) load(q);

// Force a fresh, correctly-sorted splat frame into the drawing buffer.
// (The self-driven rAF loop is throttled in hidden/offscreen windows, and a
// bare renderer.render() skips the splat sort — use the viewer's own path.)
function renderFresh(){
  try { viewer.update(); viewer.render(); }
  catch(e){ renderer.render(viewer?.threeScene ?? new THREE.Scene(), camera); }
}

capBtn.addEventListener('click', () => {
  renderFresh();
  const png = renderer.domElement.toDataURL('image/png');
  const t = viewer?.controls?.target ?? new THREE.Vector3();
  const cam = {
    position: camera.position.toArray(),
    target: [t.x, t.y, t.z],
    up: camera.up.toArray(),
    fov: camera.fov,
    aspect: camera.aspect,
    captured_at: new Date().toISOString(),
  };
  const stamp = Date.now();
  dl(png, `frame_${stamp}.png`);
  dl('data:application/json,' + encodeURIComponent(JSON.stringify(cam, null, 2)), `camera_${stamp}.json`);
  statusEl.textContent = `Captured frame_${stamp}.png + camera_${stamp}.json → next: lock.py`;
});

function dl(href, name){
  const a = document.createElement('a'); a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

// post the captured frame to the host app (when embedded in an iframe)
window.addEventListener('message', e => { if (e.data === 'hjen:capture') capBtn.click(); });

// programmatic control seam — used by WorldView (HJEN SET) and automated tests.
window.__hjen = {
  get camera(){ return camera },
  get viewer(){ return viewer },
  setCam(pos, tgt, fov){
    if (fov){ camera.fov = fov; camera.updateProjectionMatrix(); }
    if (pos) camera.position.set(pos[0], pos[1], pos[2]);
    const t = viewer?.controls?.target;
    if (tgt && t) t.set(tgt[0], tgt[1], tgt[2]);
    if (tgt) camera.lookAt(tgt[0], tgt[1], tgt[2]);
    viewer?.controls?.update?.();
  },
  async refresh(frames = 12, dt = 60){
    for (let i = 0; i < frames; i++){ renderFresh(); await new Promise(r => setTimeout(r, dt)); }
  },
  capture(){
    renderFresh();
    const t = viewer?.controls?.target ?? new THREE.Vector3();
    return {
      png: renderer.domElement.toDataURL('image/png'),
      camera: { position: camera.position.toArray(), target: [t.x, t.y, t.z],
                up: camera.up.toArray(), fov: camera.fov, aspect: camera.aspect },
    };
  },
  status(){ return { loaded: !capBtn.disabled, status: statusEl.textContent, err: errEl.textContent }; },
};
</script>
</body>
</html>
